[project]
name = "cortex"
version = "0.1.0"
description = "Knowledge service: retrieval and ingestion APIs over an OKF bundle. No LLM agent inside."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.0.0",
    "fastapi>=0.141.1",
    "google-cloud-storage>=2.18.0",
    "httpx>=0.27.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.9.0",
    "PyYAML>=6.0.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=4.0.0",
    "google-cloud-aiplatform>=1.80.0",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.141.1",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.fastapi]
entrypoint = "cortex.api.app:app"

[project.scripts]
cortex = "cortex.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
